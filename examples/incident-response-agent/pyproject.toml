[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-incident-response-agent"
version = "0.1.0"
description = "Standalone synthetic agentic incident-response pipeline"
requires-python = ">=3.11"

[project.scripts]
incident-agent = "incident_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
