[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-policy-author"
version = "0.7.0"
description = "Portable policy authoring and lifecycle management for tool-using agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.TXT"]
requires-python = ">=3.11"
keywords = [
  "agents",
  "authorization",
  "cedar",
  "cerbos",
  "opa",
  "policy-as-code",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "jsonschema>=4.25,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "textual>=1.0,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
policy-author = "policy_authoring.cli:app"

[project.urls]
Documentation = "https://github.com/veersingh_microsoft/Agent-Policy-Author#readme"
Issues = "https://github.com/veersingh_microsoft/Agent-Policy-Author/issues"
Repository = "https://github.com/veersingh_microsoft/Agent-Policy-Author"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_authoring"]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hook.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "native_engines: requires OPA, Cedar, Docker, and the Cerbos image",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["policy_authoring"]
