name: Policy Author CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --editable .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest

      - name: Build wheel and source distribution
        run: python -m build
        env:
          POLICY_AUTHOR_BUILD_COMMIT: ${{ github.sha }}
          POLICY_AUTHOR_BUILD_DIRTY: "false"

      - name: Verify build metadata cleanup
        run: python -c "from pathlib import Path; assert not Path('src/policy_authoring/_build_info.py').exists()"

      - name: Smoke test installed wheel
        if: matrix.python-version == '3.13'
        run: |
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('dist/*.whl')[0]])"
          policy-author --version
          python -c "from policy_authoring.cli import app; commands={item.name: item for item in app.registered_commands}; assert {'approval-preview','compile-draft','compile-workspace','verify-bundle','evaluate-current'} <= commands.keys(); assert 'serve' not in commands; assert commands['compile'].hidden"
          python -c "from policy_authoring import _build_info; assert _build_info.SOURCE_COMMIT == '${{ github.sha }}'; assert _build_info.SOURCE_DIRTY == 'false'"

      - name: Generate CycloneDX SBOM
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload distribution and SBOM
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-author-distribution
          path: |
            dist/*
            sbom.cdx.json
          if-no-files-found: error
